[project]
name = "discolab"
version = "0.1.0"
description = "Dynamic-landscape evaluation environment and bio-inspired search baselines for studying evolutionary-search stagnation"
requires-python = ">=3.12"
# The agent runtime is Muse Code (Meta's `muse` CLI), launched as an external
# process; the lab only needs `mcp` to serve its deterministic tools to it.
# The original Omnigent bundle (omnigent/lab_pi) stays runnable via the
# optional `omnigent` extra.
dependencies = ["numpy>=2", "scipy>=1.13", "pydantic>=2", "pyyaml>=6", "mcp>=1.2,<2", "httpx>=0.27"]

[tool.setuptools]
# Explicit: the directory also holds omnigent/, results/ and scripts/, which
# setuptools' flat-layout auto-discovery rejects as multiple top-level packages.
packages = ["discolab"]

[project.optional-dependencies]
dev = ["pytest>=8"]
omnigent = ["omnigent==0.16.0", "omnigent-client==0.16.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
