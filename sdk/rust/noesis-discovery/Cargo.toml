[package]
name = "noesis-discovery"
version = "0.1.0"
edition = "2021"
description = "Rust client and numerical kernels for the Noesis discovery lab (talks to the Python discolab sidecar)"
license = "PolyForm-Noncommercial-1.0.0"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/coderyaz856/NOESIS-Autonomous-Information-Driven-Scientific-Discovery"
keywords = ["research", "reproducibility", "scientific-discovery", "evidence"]
categories = ["science", "api-bindings"]
include = ["src/**", "examples/**", "protocol/v1/*.json", "README.md", "LICENSE.md", "Cargo.toml"]

[dependencies]
serde_json = "1"
